[project]
name = "localshare"
version = "1.1.0"
description = "Share a local project as <name>.local on your LAN, on your tailnet, or publicly."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gilles Bertaux", email = "hello@gillesbertaux.com" }]
keywords = ["tailscale", "mdns", "bonjour", "localhost", "tunnel", "lan"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: Proxy Servers",
  "Topic :: Software Development :: Testing",
]
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/gillesbertaux/localshare"
Repository = "https://github.com/gillesbertaux/localshare"
Issues = "https://github.com/gillesbertaux/localshare/issues"

[project.scripts]
localshare = "localshare.cli:main"

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
localshare = ["templates/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
