# Project intent for localshare. Presence of this file means the repo is shareable.
schema: 1

name: {{NAME}}

target:
  port: {{PORT}}

# Desired state for `localshare up` with no flags.
# lan     = <name>.local on this Wi-Fi (anyone on the network)
# tailnet = Tailscale Serve (your devices only)
# public  = Tailscale Funnel (internet) — also requires --yes
# off     = file present, nothing exposed until a flag is passed
reach: tailnet

allow:
  lan: false
  public: false

lan:
  hostname: {{NAME}}
  # port: 80   # falls back to 7777 when 80 needs privileges

tailscale:
  https_port: 443
  path: /
  # persist: omit → true for tailnet, false for public
  # service: reserved for later (Tailscale Services)

security:
  exclusive: true
  confirm_public: true
