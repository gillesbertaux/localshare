# yaml-language-server: $schema=../schemas/localshare.schema.json
# Phone testing over Wi-Fi: http://storefront.local reaches 127.0.0.1:5173.
schema: 1
name: storefront    # -> storefront.local
target:
  port: 5173
reach: lan
allow:
  lan: true
  public: false
# name doubles as the .local hostname. Override it only to differ:
# lan:
#   hostname: shop    # -> shop.local
